name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Pacman SVGs
        run: |
          npx -y pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --gameTheme github-dark -o pacman-dark.svg
          npx -y pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --gameTheme github -o pacman-light.svg

      - name: Commit and Push SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update pacman contribution graphs [skip ci]"
          file_pattern: "pacman-dark.svg pacman-light.svg"
